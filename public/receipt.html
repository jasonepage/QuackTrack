<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt: QuackTrack</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
  <script src="/js/receipt.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/"><img class="brand-icon" src="/favicon.svg?v=2" alt="" width="36" height="36">QuackTrack</a>
  </header>

  <main class="wrap doc receipt">
    <div id="receipt" hidden>
      <p class="step-num">Submission receipt</p>
      <h1 id="r-team"></h1>
      <p id="r-hash" class="receipt-hash"></p>
      <p id="r-override" class="override-line" hidden></p>
      <p class="lede">This page shows exactly what this team signed with its key, and when. Anyone with the link can open it. The three checks run again every time the page loads.</p>

      <div id="checks" class="checks" aria-live="polite"></div>

      <dl id="r-facts" class="facts receipt-facts"></dl>

      <button id="download" class="small-button" type="button">Download receipt JSON</button>

      <h2>Verification data</h2>
      <p class="muted">For anyone who wants to re-check the signature themselves. You do not need to read this.</p>
      <dl id="r-raw" class="facts receipt-facts raw-facts"></dl>
    </div>
  </main>
</body>
</html>
