<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team room: QuackTrack</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
  <script type="module" src="/js/room.js"></script>
</head>
<body>
  <header class="topbar topbar-split">
    <span class="wordmark">QuackTrack</span>
    <button id="leave" class="small-button" type="button" hidden>Leave room</button>
  </header>

  <main class="wrap room">
    <p id="no-session" class="after-action" hidden><a class="text-link" href="/team">Go to Team tap in</a></p>

    <div id="room" hidden>
      <div id="notices"></div>
      <h1 id="team-name"></h1>
      <dl id="team-facts" class="facts"></dl>
      <p><a class="small-button" href="/chat">Team chat and The Quad</a></p>

      <section id="prompt" class="prompt-card" aria-live="polite"></section>

      <section id="submit" class="room-section" hidden>
        <h2>Submission</h2>
        <form id="sign-form" class="prompt-form sign-form" autocomplete="off" novalidate>
          <label>Project name <input id="sign-project" maxlength="80"></label>
          <label>Repo link <input id="sign-repo" type="url" maxlength="200" placeholder="https://github.com/owner/repo" spellcheck="false"></label>
          <label>Commit SHA <input id="sign-commit" maxlength="40" placeholder="Paste the output of git rev-parse HEAD" spellcheck="false" autocapitalize="off" class="mono"></label>
          <label>Description <textarea id="sign-description" maxlength="1000" rows="4"></textarea></label>
          <label class="check-row declare-row"><input id="sign-declared" type="checkbox"> We declare that this project was built during this event.</label>
          <button id="sign-button" class="action-button" type="submit">Sign submission</button>
        </form>
        <div id="sign-panel" class="sign-panel" aria-live="polite" hidden></div>
      </section>

      <section class="room-section">
        <h2>Who is at the keyboard?</h2>
        <div id="members" class="member-picker"></div>
      </section>

      <section class="room-section">
        <h2>Roster</h2>
        <ul id="roster" class="roster"></ul>
      </section>

      <section id="faq" class="room-section faq">
        <h2>Ask about the event</h2>
        <form id="faq-form" class="faq-form" autocomplete="off" novalidate>
          <label>Your question <input id="faq-question" maxlength="300" placeholder="When does judging start?"></label>
          <button id="faq-ask" class="small-button primary" type="submit">Ask</button>
        </form>
        <div id="faq-answer" aria-live="polite"></div>
        <div id="faq-list" hidden>
          <label class="faq-search">Search the event information <input id="faq-search" type="search" spellcheck="false"></label>
          <p id="faq-empty" class="muted"></p>
          <div id="faq-sections"></div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
