<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Organizer setup: QuackTrack</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
  <script type="module" src="/js/setup.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="wordmark"><img class="brand-icon" src="/favicon.svg?v=2" alt="" width="36" height="36">QuackTrack <span class="topbar-tag">Setup</span></span>
  </header>

  <main class="wrap doc">
    <h1>Organizer setup</h1>
    <p class="lede">You are the organizer. Pick the one thing you will use to open the console, then click the button. You do this once.</p>

    <fieldset class="choice">
      <legend>How will you log in?</legend>
      <label class="choice-row">
        <input type="radio" name="mode" value="passkey" checked>
        <span><strong>This laptop (easiest)</strong><small>Touch ID, Face ID, or your laptop password. Every security key stays free for the teams.</small></span>
      </label>
      <label class="choice-row">
        <input type="radio" name="mode" value="key">
        <span><strong>A security key</strong><small>A USB key that stays in your pocket. You will need it every time you log in, so do not lend it to a team.</small></span>
      </label>
    </fieldset>

    <button id="enroll" class="action-button" type="button" disabled>Enroll organizer</button>
    <p class="muted">After you click, the browser asks you to confirm. Then the console opens.</p>
    <p id="to-console" class="after-action" hidden><a class="text-link" href="/console">Go to the console</a></p>
  </main>
</body>
</html>
