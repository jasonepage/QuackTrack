<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team tap in: QuackTrack</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/api.js"></script>
  <script type="module" src="/js/team.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/"><img class="brand-icon" src="/favicon.svg" alt="" width="36" height="36">QuackTrack</a>
  </header>

  <main class="wrap doc">
    <section id="pick">
      <h1>Team tap in</h1>
      <p class="lede">Find your team below. Have your team's key in your hand.</p>
      <div id="teams" class="team-picker"></div>
    </section>

    <section id="who" hidden>
      <h1 id="who-team"></h1>
      <p id="tap-now" class="tap-now" hidden>Tap your key now</p>
      <div id="who-choice" class="who-choice">
        <button id="existing" class="action-button" type="button">I'm on this team<small>Tap the key to open your room.</small></button>
        <button id="new" class="choice-button" type="button">I'm new to this team<small>Type your GitHub handle, then tap the key to join.</small></button>
        <p class="muted">Either way: plug in your team's key and touch the gold circle when the browser asks. Only your team's key works.</p>
      </div>

      <form id="join" class="prompt-form" autocomplete="off" hidden>
        <label>GitHub handle <input id="join-handle" maxlength="39" autocapitalize="off" spellcheck="false" required></label>
        <label>Display name <input id="join-name" maxlength="40" required></label>
        <label>Role
          <select id="join-role">
            <option>Builder</option>
            <option>Designer</option>
            <option>Presenter</option>
          </select>
        </label>
        <p class="muted">The first person to join a team is its Captain.</p>
        <button class="action-button" type="submit">Join and tap key</button>
      </form>

      <p class="after-action"><button id="back" class="link-button" type="button">Pick a different team</button></p>
    </section>
  </main>
</body>
</html>
